# DUMMY VALUE ONLY for the classroom demo. Never commit real credentials.
# Create it with kubectl instead of applying this file if you prefer:
#   kubectl create secret generic student-directory-secret --from-literal=APP_TOKEN=dummy-token-123
apiVersion: v1
kind: Secret
metadata:
  name: student-directory-secret
  labels:
    app: student-directory
type: Opaque
stringData:
  APP_TOKEN: "dummy-token-123"
