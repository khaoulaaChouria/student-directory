# Read-only access to the Student Directory resources for an authorized user/group.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: student-directory-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: student-directory-reader-binding
  namespace: default
subjects:
  - kind: User
    name: student-reader        # test user; adjust to your auth setup
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: student-directory-reader
  apiGroup: rbac.authorization.k8s.io
